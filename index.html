<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visa Input</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="center">
        <div class="above  b-1 b-black rounded-sm card">
            <div class="flex justify-sb align-c" style="align-items: flex-start;">
                <h2>WDS Bank</h2>
                <img width="80" src="mastercard.svg" alt="mastercard"/>
            </div>
            <div>
                <p>CARD NUMBER</p>
                <div class="flex gap-2" id="card-number">
                    <input type="int" class="size-10" size="4" maxlength="4"/>
                    <input type="int" class="size-10" size="4" maxlength="4" />
                    <input type="int" class="size-10" size="4" maxlength="4" />
                    <input type="int" class="size-10" size="4" maxlength="4" />
                </div>
            </div>
            <div class="flex justify-sb w-full">
                <div>
                    <p>NAME</p>
                    <input type="text" id="name" class="size-70">
                </div>
                <div>
                    <p>EXPIRATION</p>
                    <div class="flex gap-2">
                    <select class="input-like">
                        <!-- <option value="" disabled selected>Select month</option> -->
                        <option>01</option>
                        <option>02</option>
                        <option>03</option>
                        <option>04</option>
                        <option>05</option>
                        <option>06</option>
                        <option>07</option>
                        <option>08</option>
                        <option>09</option>
                        <option>10</option>
                        <option>11</option>
                        <option>12</option>
                    </select>

                    <select class="input-like" style="width: 164%">
                        <!-- <option value="" disabled selected>Select month</option> -->
                        <option>2026</option>
                        <option>2027</option>
                        <option>2028</option>
                        <option>2029</option>
                        <option>2030</option>
                        <option>2031</option>
                        <option>2032</option>
                        <option>2033</option>
                        <option>2034</option>
                        <option>2035</option>
                    </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="below b-1 b-black rounded-sm card"></div>
   </div> 
   </body>
   <script src="main.js"></script>
</html>
